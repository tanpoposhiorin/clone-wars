<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clone Wars</title>
<!--
  This page is the frame for your game. Nobody edits it: not you, not the agents.
  It loads your four build files in this order, then shows the starter panel
  if game.js doesn't exist yet.
-->
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: #101826; color: #f5f7fb; font: 16px/1.45 system-ui, -apple-system, Segoe UI, sans-serif; }
  body { touch-action: manipulation; }

  #stage { position: relative; width: fit-content; margin: 0 auto; }
  #game { display: block; max-width: 100vw; max-height: 100vh; }
  #overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; text-align: center; background: rgba(8, 12, 24, 0.5); pointer-events: none; }
  #overlay[hidden] { display: none; }
  #overlay-title { font-size: 34px; font-weight: 800; letter-spacing: 0.02em; text-shadow: 0 2px 0 rgba(0, 0, 0, 0.5); }
  #overlay-text { white-space: pre-line; font-size: 17px; text-shadow: 0 1px 0 rgba(0, 0, 0, 0.6); }
  #fix-buttons { display: flex; gap: 10px; pointer-events: auto; }
  #fix-buttons:empty { display: none; }
  #fix-buttons button { font: inherit; font-weight: 700; padding: 9px 18px; border: 2px solid #f5f7fb; border-radius: 999px; background: transparent; color: #f5f7fb; cursor: pointer; }
  #fix-buttons button[aria-pressed="true"] { background: #f5f7fb; color: #101826; }
  #fix-buttons button:focus-visible { outline: 3px solid #ffd166; outline-offset: 3px; }
  #missing-label { position: absolute; left: 6px; right: 6px; bottom: 6px; padding: 2px 8px; font-size: 11px; color: #ffd166; background: rgba(0, 0, 0, 0.65); border-radius: 4px; pointer-events: none; }
  #missing-label:empty { display: none; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  #starter { max-width: 620px; margin: 0 auto; padding: 12vh 24px 48px; }
  #starter[hidden] { display: none; }
  #starter .eyebrow { font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: #6ee7d8; }
  #starter h1 { font-size: clamp(34px, 7vw, 56px); line-height: 1.05; margin: 12px 0 18px; }
  #starter p { color: #c9d1e3; }
  #starter .live { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 26px 0 8px; }
  #starter code { flex: 1 1 280px; min-width: 0; padding: 11px 13px; background: #1b2438; border: 1px solid #33405c; border-radius: 6px; font-size: 14px; overflow-wrap: anywhere; color: #f5f7fb; }
  #starter button { min-height: 44px; padding: 10px 18px; font: inherit; font-weight: 700; color: #101826; background: #6ee7d8; border: 0; border-radius: 6px; cursor: pointer; }
  #starter button:focus-visible { outline: 3px solid #ffd166; outline-offset: 3px; }
  #starter small { display: block; color: #97a3bd; }
</style>
</head>
<body>

<section id="starter" hidden>
  <div class="eyebrow">CPVC · Session 03 · Clone Wars</div>
  <h1>Your starter is live.</h1>
  <p>Your game shows up right here after you merge your team's pull request. This page keeps the same link the whole time.</p>
  <div class="live">
    <code id="live-url">Open this page from GitHub Pages to see its link.</code>
    <button id="copy-link" type="button">Copy link</button>
  </div>
  <small id="copy-hint">This is the link you submit to the portal. It is not your GitHub repo link.</small>
</section>

<div id="stage">
  <canvas id="game" width="360" height="640" aria-label="Game"></canvas>
  <div id="overlay" hidden>
    <div id="overlay-title"></div>
    <div id="overlay-text"></div>
    <div id="fix-buttons"></div>
  </div>
  <div id="missing-label"></div>
</div>
<div id="sr" class="sr-only" aria-live="polite"></div>

<script src="config.js"></script>
<script src="sprites.js"></script>
<script src="sounds.js"></script>
<script src="game.js"></script>
<script>
  // Starter panel: shown only until game.js exists.
  (function () {
    if (window.CLONE_WARS_GAME) return;
    document.getElementById('stage').hidden = true;
    var starter = document.getElementById('starter');
    starter.hidden = false;
    var box = document.getElementById('live-url');
    var button = document.getElementById('copy-link');
    var hint = document.getElementById('copy-hint');
    var onWeb = location.protocol === 'http:' || location.protocol === 'https:';
    var url = onWeb ? location.origin + location.pathname : '';
    if (onWeb) {
      box.textContent = url;
    } else {
      button.hidden = true;
      hint.textContent = 'You opened this file on your computer. Turn on GitHub Pages to get a real link.';
    }
    button.addEventListener('click', function () {
      function selectIt() {
        var range = document.createRange();
        range.selectNodeContents(box);
        var selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(range);
        hint.textContent = 'Link selected. Press Cmd+C (Mac) or Ctrl+C (Windows) to copy it.';
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url).then(function () {
          hint.textContent = 'Copied. Paste it into the Link box in the portal.';
        }, selectIt);
      } else {
        selectIt();
      }
    });
  })();
</script>
</body>
</html>
